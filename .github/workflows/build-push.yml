name: Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r backend/requirements.txt pytest pytest-asyncio
      - name: Run tests
        run: cd backend && python -m pytest tests/ -v

  build-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: backend/
          push: true
          tags: ghcr.io/nkz-os/nkz-module-carbon/carbon-backend:latest

  # Frontend (MF2 remote) publish via OIDC-authenticated canonical workflow.
  # The reusable workflow requests a GitHub OIDC JWT, sends it to api-gateway
  # which validates it against GitHub's JWKS before forwarding to entity-manager.
  publish-module:
    name: Publish Module (frontend)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    uses: nkz-os/nkz/.github/workflows/_publish-module.yml@main
    with:
      module_id: carbon
      working_dir: frontend
      package_json_file: frontend/package.json
    secrets:
      INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
