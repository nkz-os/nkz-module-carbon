name: Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r backend/requirements.txt pytest pytest-asyncio
      - name: Run tests
        run: cd backend && python -m pytest tests/ -v

  build-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: backend/
          push: true
          tags: ghcr.io/nkz-os/nkz-module-carbon/carbon-backend:latest

  # Frontend (MF2 remote) publish via OIDC-authenticated endpoint.
  # Directly implements the publish + verify logic (bypassing reusable workflow
  # to isolate startup_failure issue).
  publish-module:
    name: Publish Module (frontend)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - name: Install deps
        run: cd frontend && pnpm install --frozen-lockfile
      - name: Build module
        run: cd frontend && VITE_API_URL=https://nkz.robotika.cloud NKZ_VERSION_HASH=${{ github.sha }} pnpm run build:module
      - name: Get GitHub OIDC token
        run: |
          OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nkz-publish")
          echo "OIDC_TOKEN=${OIDC_TOKEN}" >> $GITHUB_ENV
      - name: Publish to entity-manager
        env:
          SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
        working-directory: frontend
        run: |
          set -euo pipefail
          SHA=$(echo "${{ github.sha }}" | cut -c1-40)
          args=$(cd dist && find . -type f -printf '-F file=@%p;filename=%P ')
          code=$(cd dist && curl -sS -o /tmp/pub.json -w '%{http_code}' \
                 -H "X-Internal-Service-Secret: $SECRET" \
                 -H "X-OIDC-Token: $OIDC_TOKEN" \
                 -F "version_hash=$SHA" $args \
                 "https://nkz.robotika.cloud/api/internal/modules/carbon/publish")
          echo "publish HTTP $code"; cat /tmp/pub.json; echo
          case "$code" in 200|201) ;; *) echo "::error::publish failed (HTTP $code)"; exit 1;; esac
